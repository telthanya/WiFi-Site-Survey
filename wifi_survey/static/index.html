<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi Site Survey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <h1>📶 Wi-Fi Site Survey</h1>

  <section>
    <h2>โปรเจกต์</h2>
    <input id="projName" type="text" placeholder="ชื่อโปรเจกต์" value="โปรเจกต์ใหม่">
    <div class="row">
      <button id="btnSave" class="primary">บันทึก</button>
      <button id="btnNew">ใหม่</button>
    </div>
    <div class="row">
      <select id="projList"><option value="">— เปิดโปรเจกต์ที่บันทึกไว้ —</option></select>
      <button id="btnOpen">เปิด</button>
    </div>
    <div class="row">
      <button id="btnDlJson">ดาวน์โหลด JSON</button>
      <label class="btn">นำเข้า JSON<input id="fileJson" type="file" accept=".json" hidden></label>
    </div>
  </section>

  <section>
    <h2>1) แปลนอาคาร</h2>
    <label class="btn primary block">อัปโหลดรูปแปลน (PNG/JPG)<input id="filePlan" type="file" accept="image/*" hidden></label>
    <button id="btnScale" class="block" disabled>ตั้งสเกล (คลิก 2 จุดบนแปลน)</button>
    <div id="scaleInfo" class="hint">ยังไม่ได้ตั้งสเกล</div>
  </section>

  <section>
    <h2>2) เครื่องมือ</h2>
    <div id="tools" class="tools">
      <button data-tool="select" class="active" title="เลือก/ย้าย (V)">↖ เลือก</button>
      <button data-tool="point" title="วางจุดวัดแล้วสแกน (P)">📍 จุดวัด</button>
      <button data-tool="ap" title="วางตำแหน่ง AP (A)">📡 AP</button>
    </div>
    <label>โหมดสแกน
      <select id="scanMode">
        <option value="real">สแกนจริง (การ์ด Wi-Fi ของเครื่องนี้)</option>
        <option value="sim">จำลอง (จาก AP ที่วางไว้)</option>
      </select>
    </label>
    <label>จำนวนรอบสแกนต่อจุด (เฉลี่ย)
      <input id="samples" type="number" min="1" max="10" value="2">
    </label>
    <div id="scanNote" class="hint"></div>
  </section>

  <section>
    <h2>3) Heatmap</h2>
    <label class="check"><input id="hmShow" type="checkbox" checked> แสดง heatmap</label>
    <label>แหล่งข้อมูล
      <select id="hmSource">
        <option value="measured">ค่าที่วัดจริง (ประมาณค่าระหว่างจุด)</option>
        <option value="predicted">จำลองจาก AP ที่วางไว้</option>
      </select>
    </label>
    <label>แสดงของ
      <select id="hmFilter"></select>
    </label>
    <label>เกณฑ์ RSSI ที่ยอมรับได้ (dBm)
      <input id="target" type="number" value="-67" min="-95" max="-30">
    </label>
    <label>ความโปร่งแสง
      <input id="opacity" type="range" min="10" max="100" value="65">
    </label>
    <label>ค่า path-loss exponent (จำลอง)
      <input id="plExp" type="number" step="0.1" min="2" max="5" value="3">
    </label>
    <div id="stats" class="stats"></div>
    <div class="legend"><span>-90</span><i></i><span>-50 dBm</span></div>
  </section>

  <section id="selPanel" hidden>
    <h2>รายการที่เลือก</h2>
    <div id="selBody"></div>
  </section>

  <section>
    <h2>4) รายงาน</h2>
    <input id="surveyor" type="text" placeholder="ชื่อผู้สำรวจ (ไม่บังคับ)">
    <label>ภาษารายงาน
      <select id="lang"><option value="en">English</option><option value="th">ไทย (ต้องมีฟอนต์ไทยในเครื่อง)</option></select>
    </label>
    <button id="btnPdf" class="primary block">สร้างรายงาน PDF</button>
    <button id="btnCsv" class="block">ส่งออก CSV</button>
    <button id="btnPng" class="block">ส่งออกภาพ heatmap (JPG)</button>
  </section>
  <div class="hint small">ช่วยเหลือ: ล้อเมาส์ = ซูม · ลากพื้นที่ว่าง/คลิกกลาง = เลื่อน · Delete = ลบ · Esc = ยกเลิก</div>
</aside>

<main id="stage">
  <canvas id="cv"></canvas>
  <div id="empty">อัปโหลดรูปแปลนอาคารเพื่อเริ่มต้น</div>
  <div id="busy" hidden><div class="spin"></div><span id="busyText">กำลังสแกน…</span></div>
  <div id="toast" hidden></div>
</main>
<script src="app.js"></script>
</body>
</html>
